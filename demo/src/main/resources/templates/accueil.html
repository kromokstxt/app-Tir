<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Accueil</title>
</head>
<body>

    <header class="entete">
        <span class="qui">
            👤 Bonjour <span th:text="${moi.firstName}"></span>
            <span th:if="${admin}">(admin)</span>
        </span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
        </form>
    </header>

    <h1 th:text="${club.nom}">Stand de tir</h1>

    <nav class="tuiles">
        <a th:href="@{/resultats/ajouter}" class="tuile tir large"><span class="icone">🎯</span>Entrer un tir</a>
        <a th:href="@{/resultats}" class="tuile resultats"><span class="icone">📊</span>
            <span th:text="${admin} ? 'Résultats' : 'Mes résultats'">Mes résultats</span></a>
        <a th:href="@{/calendrier}" class="tuile calendrier"><span class="icone">📅</span>Calendrier</a>
        <a th:href="@{/annonces}" class="tuile annonces"><span class="icone">📢</span>Annonces du comité</a>
        <a th:href="@{/classement}" class="tuile classement"><span class="icone">🏆</span>Classement</a>
        <a th:href="@{/armes}" class="tuile armes"><span class="icone">🎖️</span>
            <span th:text="${admin} ? 'Armes' : 'Mes armes'">Mes armes</span></a>
        <a th:href="@{/licences}" class="tuile licences"><span class="icone">📇</span>
            <span th:text="${admin} ? 'Licences' : 'Ma licence'">Ma licence</span></a>
        <a th:href="@{/profil}" class="tuile profil"><span class="icone">👤</span>Mon profil</a>
    </nav>

    <th:block th:if="${admin}">
        <h2 class="section">Administration</h2>
        <nav class="tuiles">
            <a th:href="@{/tireurs}" class="tuile admin"><span class="icone">👥</span>Tireurs</a>
            <a th:href="@{/saisons}" class="tuile admin"><span class="icone">🗓️</span>Saisons</a>
            <a th:href="@{/categories}" class="tuile admin"><span class="icone">📋</span>Catégories de tir</a>
        </nav>
    </th:block>

</body>
</html>
