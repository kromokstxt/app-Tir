<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Résultats</title>
    <script th:src="@{/cible.js}"></script>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2><svg th:replace="~{fragments :: icone('resultats')}"></svg> <span th:text="${admin} ? 'Résultats' : 'Mes résultats'">Mes résultats</span></h2>

    <a th:href="@{/resultats/ajouter}" class="bouton principal"><svg th:replace="~{fragments :: icone('cible')}"></svg> Entrer un tir</a>

    <div class="moyenne" th:if="${moyenne >= 0}">
        <span th:text="${admin} ? 'Moyenne de tous les tirs' : 'Ma moyenne'">Ma moyenne</span>
        <strong th:text="${#numbers.formatDecimal(moyenne, 1, 1)} + ' / 100'"></strong>
        <span th:text="'sur ' + ${#lists.size(resultats)} + (${#lists.size(resultats)} > 1 ? ' tirs' : ' tir')"></span>
    </div>
    <p class="info" th:if="${#lists.isEmpty(resultats)}">Pas encore de tir. Touchez « Entrer un tir » pour commencer.</p>

    <ul>
        <li th:each="resultat : ${resultats}">
            <a th:href="@{/resultats/{id}(id=${resultat.id})}" class="cible cible-mini" data-cible
               th:attr="data-coups=${resultat.coupsTexte}"></a>
            <div class="details">
            <span class="note" th:text="${#numbers.formatDecimal(resultat.noteSur100, 1, 1)} + ' / 100'"></span><br>
            <span th:text="${resultat.date}"></span> —
            <span th:text="${resultat.arme}"></span>
            <span class="badge" th:if="${resultat.externe}">Tir externe</span><br>
            <span th:text="${resultat.score} + ' points sur ' + ${resultat.scoreMax}"></span>
            (<span th:text="${#lists.size(resultat.coups)}"></span> coups)
            <th:block th:if="${admin}"><br><svg th:replace="~{fragments :: icone('profil')}"></svg> <span th:text="${@clubDonnees.nomTireur(resultat.tireurId)}"></span></th:block>
            </div>
            <a th:href="@{/resultats/{id}(id=${resultat.id})}" class="bouton"><svg th:replace="~{fragments :: icone('cible')}"></svg> Voir la cible</a>
            <a th:href="@{/resultats/{id}/modifier(id=${resultat.id})}" class="bouton"><svg th:replace="~{fragments :: icone('modifier')}"></svg> Modifier</a>
            <form th:action="@{/resultats/{id}/supprimer(id=${resultat.id})}" method="post"
                  onsubmit="return confirm('Supprimer ce tir ?')">
                <button type="submit"><svg th:replace="~{fragments :: icone('supprimer')}"></svg> Supprimer</button>
            </form>
        </li>
    </ul>

</body>
</html>
