<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Résultat</title>
    <script th:src="@{/cible.js}"></script>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${resultat == null} ? 'Ajouter un résultat' : 'Modifier un résultat'">Résultat</h2>

    <p id="erreur-js" class="erreur" hidden>
        Un problème empêche la saisie des coups. Rechargez la page
        (sur téléphone : tirez la page vers le bas ; sur ordinateur : Ctrl + F5).
    </p>

    <p th:if="${#lists.isEmpty(mesSeances)}">
        Il faut d'abord une séance : <a th:href="@{/seances/ajouter}">ajouter une séance</a>.
    </p>

    <form th:unless="${#lists.isEmpty(mesSeances)}"
          th:action="${resultat == null} ? @{/resultats/ajouter} : @{/resultats/{id}/modifier(id=${resultat.id})}" method="post"
          onsubmit="terminerCoup()">
        <label>Séance :
            <select name="seanceId">
                <option th:each="s, etat : ${mesSeances}" th:value="${s.id}" th:text="${@clubDonnees.nomSeance(s.id)}"
                        th:selected="${resultat == null ? etat.first : s.id == resultat.seanceId}"></option>
            </select>
        </label>
        <label>Catégorie :
            <select name="categorieId">
                <option th:each="c : ${@clubDonnees.categories}" th:value="${c.id}" th:text="${c.nom}"
                        th:selected="${resultat != null and c.id == resultat.categorieId}"></option>
            </select>
        </label>
        <label>Date : <input type="date" name="date" th:value="${resultat?.date ?: aujourdhui}" required></label>

        <div class="choix-echelle">
            Type :
            <label><input type="radio" name="concours" value="false" onchange="changerType()"
                          th:checked="${resultat == null or !resultat.concours}"> Entraînement</label>
            <label><input type="radio" name="concours" value="true" onchange="changerType()"
                          th:checked="${resultat != null and resultat.concours}"> Concours (coups profonds)</label>
        </div>

        <h3>Les coups</h3>
        <p class="etape" id="consigne"></p>

        <!-- Les points du coup. Toucher les points du coup suivant enregistre le coup en cours. -->
        <div class="clavier" id="etape-points">
            <button type="button" onclick="choisirPoints('10')">10</button>
            <button type="button" onclick="choisirPoints('9')">9</button>
            <button type="button" onclick="choisirPoints('8')">8</button>
            <button type="button" onclick="choisirPoints('7')">7</button>
            <button type="button" onclick="choisirPoints('6')">6</button>
            <button type="button" onclick="choisirPoints('5')">5</button>
            <button type="button" onclick="choisirPoints('4')">4</button>
            <button type="button" onclick="choisirPoints('3')">3</button>
            <button type="button" onclick="choisirPoints('2')">2</button>
            <button type="button" onclick="choisirPoints('1')">1</button>
            <button type="button" onclick="choisirPoints('0')">0</button>
            <button type="button" class="manque" onclick="ajouter('M')">M</button>
        </div>

        <!-- Concours : le coup profond, sur 100 -->
        <div id="etape-profond" hidden>
            <div class="saisie-en-cours" id="profond-en-cours"></div>
            <div class="clavier">
                <button type="button" onclick="chiffre('7')">7</button>
                <button type="button" onclick="chiffre('8')">8</button>
                <button type="button" onclick="chiffre('9')">9</button>
                <button type="button" onclick="profond = profond.slice(0, -1); majEtape()">⌫</button>
                <button type="button" onclick="chiffre('4')">4</button>
                <button type="button" onclick="chiffre('5')">5</button>
                <button type="button" onclick="chiffre('6')">6</button>
                <button type="button" class="ok" onclick="validerProfond()" style="grid-row: span 3">OK</button>
                <button type="button" onclick="chiffre('1')">1</button>
                <button type="button" onclick="chiffre('2')">2</button>
                <button type="button" onclick="chiffre('3')">3</button>
                <button type="button" onclick="chiffre('0')" style="grid-column: span 3">0</button>
            </div>
        </div>

        <!-- La flèche du coup (facultative) : direction depuis le centre -->
        <p class="sous-titre">Flèche (facultatif) :</p>
        <div class="clavier fleches" id="etape-direction">
            <button type="button" onclick="choisirDirection('HG')">↖</button>
            <button type="button" onclick="choisirDirection('H')">↑</button>
            <button type="button" onclick="choisirDirection('HD')">↗</button>
            <button type="button" onclick="choisirDirection('G')">←</button>
            <button type="button" class="sans-fleche" onclick="choisirDirection('')">sans<br>flèche</button>
            <button type="button" onclick="choisirDirection('D')">→</button>
            <button type="button" onclick="choisirDirection('BG')">↙</button>
            <button type="button" onclick="choisirDirection('B')">↓</button>
            <button type="button" onclick="choisirDirection('BD')">↘</button>
        </div>

        <p>
            <button type="button" onclick="retirerDernier()">↩ Effacer le dernier coup</button>
            <button type="button" onclick="toutEffacer()">Tout effacer</button>
        </p>

        <p><strong id="total">Total : 0</strong></p>
        <div class="cible cible-apercu" id="apercu"></div>
        <ol id="liste-coups" class="liste-coups"></ol>

        <input type="hidden" name="coups" id="coups" th:value="${resultat?.coupsTexte}">

        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/resultats}">← Résultats</a>

    <script>
        // Saisie d'un coup : on touche les points, puis (en concours) le coup profond et OK,
        // puis la flèche si on veut. Toucher directement les points du coup suivant
        // enregistre le coup en cours sans flèche.
        const champ = document.getElementById('coups');
        let enCours = null;   // le coup en cours : { points, profond }
        let profond = '';     // chiffres du coup profond pendant qu'on le tape

        function concours() {
            return document.querySelector('input[name=concours]:checked').value === 'true';
        }

        function coups() {
            return Cible.lireCoups(champ.value);
        }

        function enregistrer(texte) {
            champ.value = coups().map(function (c) { return c.texte; }).concat([texte]).join(' ');
        }

        // Enregistre le coup en cours (avec la flèche si on en donne une).
        function terminerCoup(direction) {
            if (enCours === null || enCours.profond === undefined) return;
            let texte = enCours.points;
            if (enCours.profond !== null) texte += ':' + enCours.profond;
            if (direction) texte += '>' + direction;
            enregistrer(texte);
            enCours = null;
        }

        function choisirPoints(p) {
            terminerCoup();
            // En concours, le coup profond reste à taper (undefined = pas encore donné).
            enCours = { points: p, profond: concours() ? undefined : null };
            profond = '';
            majEtape();
        }

        function ajouter(texte) {   // M = manqué : enregistré tout de suite
            terminerCoup();
            enCours = null;
            enregistrer(texte);
            majEtape();
        }

        function chiffre(c) {
            if ((profond + c).length <= 3 && Number(profond + c) <= 100) profond += c;
            majEtape();
        }

        function validerProfond() {
            if (profond === '') return;
            enCours.profond = Number(profond);
            majEtape();
        }

        function choisirDirection(direction) {
            if (enCours === null || enCours.profond === undefined) return;
            terminerCoup(direction);
            majEtape();
        }

        function retirerDernier() {
            if (enCours !== null) {
                enCours = null;          // annule le coup en cours
            } else {
                champ.value = coups().slice(0, -1).map(function (c) { return c.texte; }).join(' ');
            }
            majEtape();
        }

        function toutEffacer() {
            if ((coups().length === 0 && enCours === null) || confirm('Effacer tous les coups ?')) {
                champ.value = '';
                enCours = null;
                majEtape();
            }
        }

        function changerType() {
            // Les coups n'ont pas les mêmes infos : changer de type recommence la saisie.
            if ((coups().length > 0 || enCours !== null)
                    && !confirm('Changer de type efface les coups déjà saisis. Continuer ?')) {
                document.querySelector('input[name=concours][value="' + !concours() + '"]').checked = true;
                return;
            }
            champ.value = '';
            enCours = null;
            majEtape();
        }

        // Montre les bons boutons, la consigne, le total, la liste des coups et la cible.
        function majEtape() {
            const liste = coups();
            const numero = liste.length + 1;
            const tapeProfond = enCours !== null && enCours.profond === undefined;
            document.getElementById('etape-points').hidden = tapeProfond;
            document.getElementById('etape-profond').hidden = !tapeProfond;
            document.getElementById('profond-en-cours').textContent = profond;
            document.querySelectorAll('#etape-direction button').forEach(function (b) {
                b.disabled = enCours === null || tapeProfond;
            });

            let consigne;
            if (enCours === null) {
                consigne = 'Coup ' + numero + ' : touchez les points (M = manqué).';
            } else if (tapeProfond) {
                consigne = 'Coup ' + numero + ' : ' + enCours.points + ' points — tapez le coup profond (sur 100) puis OK.';
            } else {
                consigne = 'Coup ' + numero + ' : ' + enCours.points + ' points'
                    + (enCours.profond !== null ? ' (' + enCours.profond + ')' : '')
                    + ' — touchez la flèche, ou directement les points du coup suivant.';
            }
            document.getElementById('consigne').textContent = consigne;

            document.getElementById('total').textContent =
                'Total : ' + Cible.total(liste) + ' / ' + (liste.length * 10)
                + (concours() ? ' — coups profonds : ' + Cible.totalProfond(liste) + ' / ' + (liste.length * 100) : '')
                + ' (' + liste.length + ' coups)';
            const ol = document.getElementById('liste-coups');
            ol.innerHTML = '';
            liste.forEach(function (c) {
                const li = document.createElement('li');
                li.textContent = Cible.decrire(c);
                ol.appendChild(li);
            });
            Cible.dessiner(document.getElementById('apercu'), liste);
        }

        // Si quelque chose ne marche pas (par ex. une vieille copie du script), on le dit.
        function montrerErreur() {
            document.getElementById('erreur-js').hidden = false;
        }
        window.addEventListener('error', montrerErreur);

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.Cible || !Cible.decrire) {
                montrerErreur();
                return;
            }
            majEtape();
        });
    </script>

</body>
</html>
