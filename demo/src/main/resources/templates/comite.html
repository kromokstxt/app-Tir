<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comité</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Comité :</h2>

    <a th:if="${admin}" th:href="@{/comite/ajouter}">+ Ajouter un membre du comité</a>

    <ul>
        <li th:each="membre : ${membres}">
            <strong th:text="${membre.fonction}"></strong> :
            <span th:text="${membre.prenom}"></span>
            <span th:text="${membre.nom}"></span>
            <span th:if="${admin}">
                <a th:href="@{/comite/{id}/modifier(id=${membre.id})}">Modifier</a>
                <form th:action="@{/comite/{id}/supprimer(id=${membre.id})}" method="post" style="display:inline">
                    <button type="submit">Supprimer</button>
                </form>
            </span>
        </li>
    </ul>

</body>
</html>
