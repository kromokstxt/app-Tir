<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Créer un compte</title>
</head>
<body>

    <h1 th:text="${club.nom}">Stand de tir</h1>

    <h2>Créer un compte</h2>

    <p class="erreur" th:if="${erreur}" th:text="${erreur}"></p>
    <p class="info">Pour vous connecter ensuite : votre prénom, votre nom et votre mot de passe.</p>

    <form th:action="@{/inscription}" method="post">
        <label>Prénom : <input type="text" name="firstName" th:value="${firstName}" required></label>
        <label>Nom : <input type="text" name="lastName" th:value="${lastName}" required></label>
        <label>Mot de passe : <input type="password" name="password" required></label>
        <label>Numéro de licence (6 caractères, facultatif) — votre numéro utilisé pour le politronique au stand :
            <input type="text" name="licence" th:value="${licence}" minlength="6" maxlength="6">
        </label>

        <h3>Mes armes (facultatif, jusqu'à 4)</h3>
        <!-- 4 lignes : la première est visible, le bouton fait apparaître les suivantes. -->
        <div th:each="ligne, etat : ${lignesArme}" class="ligne-arme"
             th:hidden="${etat.index > 0 and #strings.isEmpty(ligne[0])}">
            <label>Arme <span th:text="${etat.count}"></span> :
                <select name="categorie" onchange="montrerVersion(this)">
                    <option value="">— aucune —</option>
                    <option th:each="c : ${categoriesArme}" th:value="${c}" th:text="${c}"
                            th:selected="${c == ligne[0]}"></option>
                </select>
            </label>
            <label class="version-57">Version :
                <select name="version">
                    <option th:each="v : ${versions57}" th:value="${v}" th:text="'57/' + ${v}"
                            th:selected="${v == ligne[1]}"></option>
                </select>
            </label>
        </div>
        <button type="button" id="ajouter-arme" onclick="ajouterArme()">+ Ajouter une arme</button><br><br>

        <button type="submit">Créer mon compte</button>
    </form>

    <p><a th:href="@{/login}" class="bouton">← Retour à la connexion</a></p>

    <script>
        // Pour un Fas 57 seulement : choisir 02 ou 03.
        function montrerVersion(choix) {
            choix.closest('.ligne-arme').querySelector('.version-57').hidden = choix.value !== 'Fas 57';
        }
        document.querySelectorAll('.ligne-arme select[name=categorie]').forEach(montrerVersion);

        // Affiche la ligne d'arme suivante ; le bouton disparaît quand les 4 sont visibles.
        function ajouterArme() {
            const cachees = document.querySelectorAll('.ligne-arme[hidden]');
            if (cachees.length > 0) cachees[0].hidden = false;
            if (cachees.length <= 1) document.getElementById('ajouter-arme').hidden = true;
        }
        if (document.querySelectorAll('.ligne-arme[hidden]').length === 0) {
            document.getElementById('ajouter-arme').hidden = true;
        }
    </script>

</body>
</html>
