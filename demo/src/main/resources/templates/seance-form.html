<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Séance</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${seance == null} ? 'Ajouter une séance' : 'Modifier une séance'">Séance</h2>

    <form th:action="${seance == null} ? @{/seances/ajouter} : @{/seances/{id}/modifier(id=${seance.id})}" method="post">
        <label>Date : <input type="date" name="date" th:value="${seance?.date ?: aujourdhui}" required></label>
        <label>Type : <input type="text" name="type" th:value="${seance?.type}" required></label><br>
        <label>Lieu : <input type="text" name="lieu" th:value="${seance?.lieu}" required></label><br>
        <p><small>La saison est choisie automatiquement d'après la date.</small></p>
        <label th:replace="~{fragments :: choixTireur(${seance?.tireurId})}"></label>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/seances}">← Séances</a>

</body>
</html>
