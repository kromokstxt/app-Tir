<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Licences</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${admin} ? 'Licences :' : 'Mes licences :'">Licences :</h2>

    <a th:href="@{/licences/ajouter}" class="bouton principal">+ Ajouter une licence</a>

    <ul>
        <li th:each="licence : ${licences}">
            N° <span th:text="${licence.numero}"></span>
            <span th:if="${admin}" th:text="'— ' + ${@clubDonnees.nomTireur(licence.tireurId)}"></span>
            <a th:href="@{/licences/{id}/modifier(id=${licence.id})}" class="bouton"><svg th:replace="~{fragments :: icone('modifier')}"></svg> Modifier</a>
            <form th:action="@{/licences/{id}/supprimer(id=${licence.id})}" method="post" onsubmit="return confirm('Supprimer ?')">
                <button type="submit"><svg th:replace="~{fragments :: icone('supprimer')}"></svg> Supprimer</button>
            </form>
        </li>
    </ul>

</body>
</html>
