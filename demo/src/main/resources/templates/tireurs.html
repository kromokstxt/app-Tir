<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Tireurs</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Tireurs :</h2>

    <a th:href="@{/tireurs/ajouter}" class="bouton principal">+ Ajouter un tireur</a>

    <ul>
        <li th:each="tireur : ${shooters}">
            <span th:text="${tireur.firstName}"></span>
            <span th:text="${tireur.lastName}"></span>
            <span th:if="${tireur.admin}">— admin</span>
            <a th:href="@{/tireurs/{id}/modifier(id=${tireur.id})}" class="bouton"><svg th:replace="~{fragments :: icone('modifier')}"></svg> Modifier</a>
            <form th:if="${tireur.id != moi.id}" th:action="@{/tireurs/{id}/supprimer(id=${tireur.id})}" method="post" style="display:inline">
                <button type="submit"><svg th:replace="~{fragments :: icone('supprimer')}"></svg> Supprimer</button>
            </form>
        </li>
    </ul>

</body>
</html>
