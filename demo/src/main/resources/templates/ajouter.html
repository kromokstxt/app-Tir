<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un tireur</title>
</head>
<body>

    <h1>Ajouter un tireur</h1>

    <form th:action="@{/tireurs/ajouter}" method="post">
        <label>Prénom : <input type="text" name="firstName" required></label><br>
        <label>Nom : <input type="text" name="lastName" required></label><br>
        <button type="submit">Ajouter</button>
    </form>

</body>
</html>
