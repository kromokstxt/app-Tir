<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- En-tête de chaque page : retour à l'accueil, qui est connecté, se déconnecter -->
    <header th:fragment="entete" class="entete">
        <a th:href="@{/}" class="bouton">🏠 Accueil</a>
        <span class="qui">
            👤 <span th:text="${moi.firstName + ' ' + moi.lastName}"></span>
            <span th:if="${admin}">(admin)</span>
        </span>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
        </form>
    </header>

    <!-- Liste des tireurs, affichée seulement pour l'admin, qui choisit à qui appartient l'élément -->
    <label th:fragment="choixTireur(selection)" th:if="${admin}">Tireur :
        <select name="tireurId">
            <option th:each="t : ${@clubDonnees.tireurs}" th:value="${t.id}"
                    th:text="${t.firstName + ' ' + t.lastName}"
                    th:selected="${selection == null ? t.id == moi.id : t.id == selection}"></option>
        </select><br>
    </label>

</body>
</html>
