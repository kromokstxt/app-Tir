<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Catégories de tir</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Catégories de tir :</h2>

    <a th:if="${admin}" th:href="@{/categories/ajouter}" class="bouton principal">+ Ajouter une catégorie</a>

    <ul>
        <li th:each="categorie : ${categories}">
            <span th:text="${categorie.nom}"></span>
            (<span th:text="${categorie.distance}"></span> m)
            <span th:if="${admin}">
                <a th:href="@{/categories/{id}/modifier(id=${categorie.id})}" class="bouton">✏️ Modifier</a>
                <form th:action="@{/categories/{id}/supprimer(id=${categorie.id})}" method="post" onsubmit="return confirm('Supprimer ?')">
                    <button type="submit">🗑️ Supprimer</button>
                </form>
            </span>
        </li>
    </ul>

</body>
</html>
