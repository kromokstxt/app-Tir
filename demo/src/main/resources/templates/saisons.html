<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Saisons</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Saisons :</h2>

    <a th:if="${admin}" th:href="@{/saisons/ajouter}">+ Ajouter une saison</a>

    <ul>
        <li th:each="saison : ${saisons}">
            <strong th:text="${saison.annee}"></strong> :
            du <span th:text="${saison.dateDebut}"></span>
            au <span th:text="${saison.dateFin}"></span>
            <span th:if="${admin}">
                <a th:href="@{/saisons/{id}/modifier(id=${saison.id})}">Modifier</a>
                <form th:action="@{/saisons/{id}/supprimer(id=${saison.id})}" method="post" style="display:inline">
                    <button type="submit">Supprimer</button>
                </form>
            </span>
        </li>
    </ul>

</body>
</html>
