<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catégorie de tir</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${categorie == null} ? 'Ajouter une catégorie' : 'Modifier une catégorie'">Catégorie</h2>

    <form th:action="${categorie == null} ? @{/categories/ajouter} : @{/categories/{id}/modifier(id=${categorie.id})}" method="post">
        <label>Nom : <input type="text" name="nom" th:value="${categorie?.nom}" required></label><br>
        <label>Distance (m) : <input type="number" name="distance" th:value="${categorie?.distance}" required></label><br>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/categories}">← Catégories</a>

</body>
</html>
