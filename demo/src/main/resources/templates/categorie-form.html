<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Catégorie de tir</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${categorie == null} ? 'Ajouter une catégorie' : 'Modifier une catégorie'">Catégorie</h2>

    <form th:action="${categorie == null} ? @{/categories/ajouter} : @{/categories/{id}/modifier(id=${categorie.id})}" method="post">
        <label>Nom : <input type="text" name="nom" th:value="${categorie?.nom}" required></label>
        <p>Distance : 300 m</p>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/categories}" class="bouton">← Catégories</a>

</body>
</html>
