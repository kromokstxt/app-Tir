<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Annonce comité</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Annonces du comité :</h2>

    <a th:if="${admin}" th:href="@{/annonces/ajouter}">+ Ajouter une annonce</a>

    <p th:if="${#lists.isEmpty(annonces)}">Aucune annonce pour le moment.</p>

    <div th:each="annonce : ${annonces}">
        <h3 th:text="${annonce.titre}"></h3>
        <p><em th:text="${annonce.date}"></em></p>
        <p th:text="${annonce.message}" style="white-space: pre-line"></p>
        <div th:if="${admin}">
            <a th:href="@{/annonces/{id}/modifier(id=${annonce.id})}">Modifier</a>
            <form th:action="@{/annonces/{id}/supprimer(id=${annonce.id})}" method="post" style="display:inline">
                <button type="submit">Supprimer</button>
            </form>
        </div>
        <hr>
    </div>

</body>
</html>
