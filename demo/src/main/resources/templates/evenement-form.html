<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Calendrier</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${evenement == null} ? 'Ajouter une date au calendrier' : 'Modifier une date du calendrier'">Calendrier</h2>

    <form th:action="${evenement == null} ? @{/calendrier/ajouter} : @{/calendrier/{id}/modifier(id=${evenement.id})}" method="post">
        <label>Date : <input type="date" name="date" th:value="${evenement?.date ?: aujourdhui}" required></label><br>
        <label>Heure : <input type="time" name="heure" th:value="${evenement?.heure}"></label><br>
        <label>Titre : <input type="text" name="titre" th:value="${evenement?.titre}" placeholder="Tir obligatoire" required></label><br>
        <label>Description : <input type="text" name="description" th:value="${evenement?.description}"></label><br>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/calendrier}">← Calendrier</a>

</body>
</html>
