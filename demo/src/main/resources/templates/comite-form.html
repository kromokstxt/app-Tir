<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comité</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${membre == null} ? 'Ajouter un membre du comité' : 'Modifier un membre du comité'">Comité</h2>

    <form th:action="${membre == null} ? @{/comite/ajouter} : @{/comite/{id}/modifier(id=${membre.id})}" method="post">
        <label>Prénom : <input type="text" name="prenom" th:value="${membre?.prenom}" required></label><br>
        <label>Nom : <input type="text" name="nom" th:value="${membre?.nom}" required></label><br>
        <label>Fonction : <input type="text" name="fonction" th:value="${membre?.fonction}" placeholder="Président" required></label><br>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/comite}">← Comité</a>

</body>
</html>
