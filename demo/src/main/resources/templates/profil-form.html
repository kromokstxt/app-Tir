<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Modifier mon profil</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Modifier mon profil</h2>

    <p class="erreur" th:if="${erreur}" th:text="${erreur}"></p>

    <form th:action="@{/profil/modifier}" method="post">
        <label>Prénom : <input type="text" name="firstName" th:value="${moi.firstName}" required></label><br>
        <label>Nom : <input type="text" name="lastName" th:value="${moi.lastName}" required></label><br>
        <label>Nouveau mot de passe (vide = inchangé) : <input type="password" name="password"></label><br>
        <button type="submit">Enregistrer</button>
    </form>

</body>
</html>
