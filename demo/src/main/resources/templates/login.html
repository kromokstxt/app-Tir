<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Connexion</title>
</head>
<body>

    <h1 th:text="${club.nom}">Stand de tir</h1>

    <h2>Connexion</h2>

    <p class="erreur" th:if="${param.error}">Nom ou mot de passe incorrect.</p>
    <p th:if="${param.deconnecte}">Vous êtes déconnecté.</p>
    <p class="info" th:if="${param.inscrit}">Votre compte est créé : connectez-vous avec votre prénom, votre nom et votre mot de passe.</p>

    <form th:action="@{/login}" method="post">
        <label>Votre prénom et nom :
            <input type="text" name="username" placeholder="Jean Dupont" autocomplete="username" required autofocus>
        </label>
        <label>Mot de passe : <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Se connecter</button>
    </form>

    <h2>Pas encore de compte ?</h2>
    <a th:href="@{/inscription}" class="bouton">✍️ Créer un compte</a>

</body>
</html>
