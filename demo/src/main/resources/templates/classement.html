<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Classement</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Classement :</h2>

    <a th:if="${admin}" th:href="@{/classement/ajouter}" class="bouton principal">+ Ajouter une ligne au classement</a>

    <ul>
        <li th:each="ligne : ${classements}">
            Saison <span th:text="${@clubDonnees.nomSaison(ligne.saisonId)}"></span> :
            <strong th:text="${ligne.position} + '.'"></strong>
            <span th:text="${@clubDonnees.nomTireur(ligne.tireurId)}"></span>
            — <span th:text="${ligne.points}"></span> points
            <span th:if="${admin}">
                <a th:href="@{/classement/{id}/modifier(id=${ligne.id})}" class="bouton"><svg th:replace="~{fragments :: icone('modifier')}"></svg> Modifier</a>
                <form th:action="@{/classement/{id}/supprimer(id=${ligne.id})}" method="post" onsubmit="return confirm('Supprimer ?')">
                    <button type="submit"><svg th:replace="~{fragments :: icone('supprimer')}"></svg> Supprimer</button>
                </form>
            </span>
        </li>
    </ul>

</body>
</html>
