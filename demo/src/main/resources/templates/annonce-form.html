<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Annonce comité</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${annonce == null} ? 'Ajouter une annonce' : 'Modifier une annonce'">Annonce</h2>

    <form th:action="${annonce == null} ? @{/annonces/ajouter} : @{/annonces/{id}/modifier(id=${annonce.id})}" method="post">
        <label>Titre : <input type="text" name="titre" th:value="${annonce?.titre}" required></label><br>
        <label>Date : <input type="date" name="date" th:value="${annonce?.date ?: aujourdhui}" required></label><br>
        <label>Message :<br>
            <textarea name="message" rows="6" cols="60" th:text="${annonce?.message}" required></textarea>
        </label><br>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/annonces}">← Annonces</a>

</body>
</html>
