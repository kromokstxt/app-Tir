<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Résultat</title>
    <script th:src="@{/cible.js}"></script>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2>Résultat</h2>

    <p>
        <strong th:text="${resultat.score} + ' / ' + ${resultat.scoreMax}"></strong>
        le <span th:text="${resultat.date}"></span>
        en <span th:text="${@clubDonnees.nomCategorie(resultat.categorieId)}"></span>
        (notation 0 à <span th:text="${resultat.echelle}"></span>)
        — séance <span th:text="${@clubDonnees.nomSeance(resultat.seanceId)}"></span>
    </p>

    <p>
        <button type="button" onclick="grandeCible.zoom.zoomer(0.7)">+ Zoom</button>
        <button type="button" onclick="grandeCible.zoom.zoomer(1.4)">− Zoom</button>
        <button type="button" onclick="grandeCible.zoom.recentrer()">Tout voir</button>
        <br><small>Pincez avec deux doigts ou utilisez la molette pour zoomer, glissez pour vous déplacer.</small>
    </p>

    <div id="grandeCible" class="cible cible-grande" data-cible data-zoom
         th:attr="data-echelle=${resultat.echelle}, data-coups=${resultat.coupsTexte}"></div>

    <h3>Feuille de résultat</h3>
    <ol>
        <li th:each="valeur : ${resultat.coups}" th:text="${valeur == 'M'} ? 'Manqué' : ${valeur}"></li>
    </ol>
    <p><small>Chaque coup est placé dans l'anneau qui correspond à sa valeur ; le numéro sur la cible est le numéro du coup.</small></p>

    <a th:href="@{/resultats/{id}/modifier(id=${resultat.id})}">Modifier</a> ·
    <a th:href="@{/resultats}">← Résultats</a>


</body>
</html>
