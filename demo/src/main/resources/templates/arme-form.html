<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arme</title>
</head>
<body>

    <div th:replace="~{fragments :: entete}"></div>

    <h2 th:text="${arme == null} ? 'Ajouter une arme' : 'Modifier une arme'">Arme</h2>

    <form th:action="${arme == null} ? @{/armes/ajouter} : @{/armes/{id}/modifier(id=${arme.id})}" method="post">
        <label>Modèle : <input type="text" name="modele" th:value="${arme?.modele}" required></label><br>
        <label>Catégorie :
            <select name="categorie">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                        th:selected="${arme != null and c == arme.categorie}"></option>
            </select>
        </label><br>
        <label th:replace="~{fragments :: choixTireur(${arme?.tireurId})}"></label>
        <button type="submit">Enregistrer</button>
    </form>

    <a th:href="@{/armes}">← Armes</a>

</body>
</html>
