spring.application.name=demo
# Mot de passe du compte « admin », utilisé seulement au tout premier démarrage (base vide). À changer !
app.admin.motdepasse=changez-moi
# Crée aussi les tireurs d'exemple Pierre et Marie au premier démarrage. Mettre false sur le vrai serveur.
app.exemples=true
# La base de données : le fichier club.db (à côté de l'application). Pour le sauvegarder, il suffit de le copier.
# On peut choisir un autre fichier au lancement : --app.base=/chemin/vers/club.db
spring.datasource.url=jdbc:sqlite:${app.base:club.db}
# SQLite n'écrit qu'une chose à la fois : une seule connexion suffit.
spring.datasource.hikari.maximum-pool-size=1
# Crée les tables (schema.sql) si elles n'existent pas encore.
spring.sql.init.mode=always
# Chaque version de cible.js et style.css a sa propre adresse : un téléphone ne garde jamais une vieille version.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
