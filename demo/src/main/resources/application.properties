spring.application.name=demo

# Mot de passe du compte « admin » au démarrage. À changer !
app.admin.motdepasse=changez-moi

# Chaque version de cible.js et style.css a sa propre adresse (ex. /cible-3f2a….js) :
# un téléphone ne peut pas garder une vieille copie qui ne va plus avec les pages.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
